
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kharcha — Flat Expense Ledger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="ExpenseTracker.css" />
</head>
<body>

  <main class="ledger">

    <header class="ledger-header">
      <h1>Kharcha</h1>
      <p class="tagline">Who paid, who owes — for the flat.</p>
    </header>

    <!-- FLATMATES -->
    <section class="card" id="flatmates-section">
      <h2>Flatmates</h2>
      <ul class="chip-list" id="flatmate-list">
        <!-- flatmate chips get added here by JS -->
      </ul>
      <form class="inline-form" id="add-flatmate-form">
        <input type="text" id="flatmate-name" placeholder="Add a flatmate's name" autocomplete="off" />
        <button type="submit" id="add-btn">Add</button>
      </form>
    </section>

    <!-- ADD EXPENSE -->
    <section class="card" id="add-expense-section">
      <h2>Add an expense</h2>
      <form id="add-expense-form">
        <div class="field">
          <label for="expense-desc">What was it for?</label>
          <input type="text" id="expense-desc" placeholder="e.g. Groceries, electricity bill" required />
        </div>

        <div class="field-row">
          <div class="field">
            <label for="expense-amount">Amount (₹)</label>
            <input type="number" id="expense-amount" min="0" step="1" required />
          </div>
          <div class="field">
            <label for="expense-paidby">Paid by</label>
            <select id="expense-paidby" required>
              <option value="" disabled selected>Select flatmate</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label>Split between</label>
          <ul class="checkbox-list" id="split-between-list">
            <!-- checkboxes for each flatmate get added here by JS -->
          </ul>
        </div>

        <button type="submit" class="primary-btn">Add expense</button>
      </form>
    </section>

    <!-- EXPENSE HISTORY -->
    <section class="card" id="history-section">
      <h2>Expense history</h2>
      <ul class="expense-list" id="expense-list">
        <li class="empty-state">No expenses added yet.</li>
      </ul>
    </section>

    <!-- SETTLE UP -->
    <section class="card" id="settle-section">
      <h2>Settle up</h2>
      <ul class="settle-list" id="settle-list">
        <li class="empty-state">Add some expenses to see who owes whom.</li>
      </ul>
    </section>

  </main>

  <script src="ExpenseTracker.js"></script>
</body>
</html>
